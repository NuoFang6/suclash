name: build-module

on:
  workflow_dispatch:
  schedule:
    # 每周一 08:00 UTC 自动重建：拉取最新 mihomo / zashboard 等依赖（自更新）
    # TODO 控制为连续两次 自动重建 失败后不执行
    - cron: "0 8 * * 1"

env:
  GH_TOKEN: ${{ github.token }}
  # 脚本内 curl GitHub API 认证用（避免未认证 60 次/小时限流）
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 手机真实架构 aarch64（纯 Go 内部链接器）
          - goos: android
            goarch: arm64
            cgo: "0"
            ndk: ""
          # x86_64 模拟器（Go 内部链接器不支持 android/amd64，需 NDK+cgo 外部链接）
          - goos: android
            goarch: amd64
            cgo: "1"
            ndk: x86_64-linux-android34

    steps:
      - name: 配置 git 默认分支（抑制 checkout 的 init 分支名提示）
        run: git config --global init.defaultBranch main

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 接收环境变量
        run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "CGO_ENABLED=${{ matrix.cgo }}" >> $GITHUB_ENV

      - name: 设置 Android NDK (cgo 矩阵)
        if: ${{ matrix.cgo == '1' }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta1

      - name: 注入 NDK 交叉编译工具链 (cgo 矩阵)
        if: ${{ matrix.cgo == '1' }}
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang" >> $GITHUB_ENV

      - name: CI
        run: |
          bash tools/ci.sh
      
      # - name: Setup upterm session
      #   uses: owenthereal/action-upterm@v1
      #   if: ${{ failure() }}
      #   with:
      #     wait-timeout-minutes: 20
      
      - name: 上传模块至 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: suclash-module-${{ matrix.goarch }}
          if-no-files-found: error
          path: build/module.zip